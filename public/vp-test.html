<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Viewport-test</title>
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: repeating-linear-gradient(#eee 0 50px, #ccc 50px 100px); }
  #info { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 3; padding: 12px; background: #fff; border: 2px solid #000; white-space: pre; font: 15px/1.5 ui-monospace, monospace; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; height: 40px; background: red; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  #content { height: 300vh; }
  .m { position: absolute; top: 0; left: -10px; width: 1px; visibility: hidden; }
</style>
</head>
<body>
<!-- A test page for the bottom bar on iPad: shows how the browser measures the screen. Not linked; removed again before going live. -->
<div id="info">…</div>
<div id="bar">fast bjælke (bottom: 0)</div>
<div id="content"></div>
<div class="m" id="vh" style="height:100vh"></div>
<div class="m" id="dvh" style="height:100dvh"></div>
<div class="m" id="svh" style="height:100svh"></div>
<div class="m" id="lvh" style="height:100lvh"></div>
<div class="m" id="sab" style="height:env(safe-area-inset-bottom)"></div>
<script>
  const h = (id) => Math.round(document.getElementById(id).getBoundingClientRect().height);
  function show() {
    const vv = window.visualViewport;
    const bar = document.getElementById('bar').getBoundingClientRect();
    document.getElementById('info').textContent =
      `browser: ${navigator.userAgent.match(/CriOS|FxiOS|EdgiOS|Version\/[\d.]+ .*Safari/)?.[0] ?? 'andet'}\n` +
      `innerHeight: ${innerHeight}\nclientHeight: ${document.documentElement.clientHeight}\n` +
      `visualViewport: ${vv ? Math.round(vv.height) + ' (offsetTop ' + Math.round(vv.offsetTop) + ')' : '-'}\n` +
      `100vh: ${h('vh')}  dvh: ${h('dvh')}  svh: ${h('svh')}  lvh: ${h('lvh')}\n` +
      `safe-area bund: ${h('sab')}\nbjælkens bund: ${Math.round(bar.bottom)}\nrullet: ${Math.round(scrollY)}`;
  }
  show();
  addEventListener('scroll', show); addEventListener('resize', show);
  window.visualViewport?.addEventListener('resize', show); window.visualViewport?.addEventListener('scroll', show);
</script>
</body>
</html>
