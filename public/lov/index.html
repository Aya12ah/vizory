<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovopslag</title>
<style>
:root{
  --bg:#f7f6f2; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --line:#e3e0d7; --accent:#2f6f4f; --accent-ink:#fff;
  --accent-soft:#e6f0ea; --mark:#fbe7a1; --hover:#f0eee7; --shadow:0 6px 24px rgba(0,0,0,.08);
  --serif: "Iowan Old Style","Charter","Georgia",serif; --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1c1a; --panel:#232522; --ink:#e9e7e1; --muted:#a3a097; --line:#383a35; --accent:#7cc39b; --accent-ink:#10251a;
  --accent-soft:#2a3a30; --mark:#6b5a1d; --hover:#2c2e2a; --shadow:0 6px 24px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);display:flex;flex-direction:column}
button{font:inherit;color:inherit}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;z-index:5}
.brand{font-weight:700;letter-spacing:.2px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
#lawSel{max-width:280px}
.searchwrap{flex:1;display:flex;gap:8px;min-width:0;max-width:720px}
#q{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 8px;font-size:13px}
.iconbtn{border:0;background:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--muted)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
main{flex:1;display:flex;min-height:0;position:relative}
#toc{width:270px;flex:0 0 auto;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:12px 8px 40px;font-size:13.5px}
#toc .t1{font-weight:700;margin:14px 8px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
#toc a{display:block;padding:4px 8px;border-radius:6px;color:var(--ink);text-decoration:none}
#toc a:hover{background:var(--hover)}
#toc a .n{color:var(--muted);margin-right:6px}
#toc a.active{background:var(--accent-soft)}
#reader{flex:1;overflow:auto;scroll-behavior:auto}
#doc{max-width:860px;margin:0 auto;padding:28px 40px 120px}
#doc h1.lt{font:600 26px/1.25 var(--serif);margin:0 0 6px}
.lawmeta{color:var(--muted);font-size:13px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.intro{font:14px/1.55 var(--serif);color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 12px;margin-bottom:26px}
.h1{font:700 15px/1.3 var(--sans);text-align:center;margin:40px 0 4px;text-transform:uppercase;letter-spacing:.6px}
.h1 + .h1s, .h1s{font:600 17px/1.35 var(--serif);text-align:center;margin:0 0 20px}
.h2{font:600 14px/1.3 var(--sans);text-align:center;margin:34px 0 2px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.h2s{font:italic 18px/1.35 var(--serif);text-align:center;margin:0 0 18px}
.h3{font:italic 16px/1.4 var(--serif);margin:26px 0 8px;color:var(--ink)}
article.p{position:relative;font:16.5px/1.62 var(--serif);padding:8px 140px 8px 14px;margin:0 -14px;border-radius:8px;scroll-margin-top:16px}
article.p:hover{background:var(--hover)}
article.p.sel{background:var(--accent-soft)}
article.p.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--mark)}100%{background:transparent}}
article.p p{margin:0 0 6px}
article.p .pn{font-weight:700;margin-right:4px;cursor:pointer}
article.p .sn{font-style:italic;font-weight:400;margin-right:2px}
article.p .l1{padding-left:28px;text-indent:-18px}
article.p .l2{padding-left:52px;text-indent:-18px}
article.p .l3{padding-left:76px;text-indent:-18px}
article.p p.par,article.p p.stk{position:relative}
article.p p.sel{background:var(--accent-soft);border-radius:6px;box-shadow:0 0 0 6px var(--accent-soft)}
.grp{font:600 12.5px/1.3 var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.rbtn{position:absolute;right:-132px;top:0;font:500 12.5px/1 var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:999px;padding:6px 10px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.rbtn:hover{border-color:var(--accent)}
.rbtn.none{color:var(--muted);opacity:.0}
article.p p:hover > .rbtn.none{opacity:.7}
.rbtn .c{background:var(--accent-soft);border-radius:999px;padding:2px 6px;color:var(--ink)}
.xref{color:inherit;text-decoration:underline dotted var(--muted);text-underline-offset:3px;cursor:pointer}
.xref:hover{color:var(--accent)}
.tbl{overflow-x:auto;margin:8px 0}
.tbl table{border-collapse:collapse;font:13.5px/1.4 var(--sans)}
.tbl td,.tbl th{border:1px solid var(--line);padding:4px 6px;vertical-align:top}
.tbl p{margin:0}
.block{font:15px/1.6 var(--serif);margin:18px 0;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.block summary{cursor:pointer;font:600 14px var(--sans)}
.block p.cp{text-align:center;font-weight:700;margin-top:12px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* Remarks panel */
#rp{width:min(560px,46vw);flex:0 0 auto;border-left:1px solid var(--line);background:var(--panel);display:none;flex-direction:column;min-height:0}
#rp.open{display:flex}
#rp .rh{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#rp .rh .row{display:flex;align-items:center;gap:8px}
#rp .rh h2{font:600 18px/1.3 var(--serif);margin:0;flex:1}
#rp .rh .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
#rp .tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
#rp .rb{overflow:auto;padding:12px 16px 80px;flex:1}
.ptext{font:14px/1.55 var(--serif);background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:14px;max-height:180px;overflow:auto;border:1px solid var(--line)}
.ptext p{margin:0 0 4px}
details.rc{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel)}
details.rc[open]{box-shadow:var(--shadow)}
details.rc > summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
details.rc > summary::-webkit-details-marker{display:none}
.rc .k{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.tag{font:600 11px/1 var(--sans);padding:4px 6px;border-radius:5px;background:var(--accent-soft);color:var(--ink);letter-spacing:.2px}
.tag.orig{background:var(--accent);color:var(--accent-ink)}
.rc .hd{font:600 14px/1.35 var(--sans)}
.rc .bt{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc .body{padding:0 14px 14px;font:15px/1.6 var(--serif)}
.rc .body p{margin:0 0 10px}
.rc .chg{font:13.5px/1.5 var(--serif);background:var(--bg);border-left:3px solid var(--accent);padding:8px 10px;margin:0 0 12px;border-radius:0 6px 6px 0}
.rc .chg p{margin:0 0 4px}
.rc .chg .lbl{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:4px}
.rc .links{font:13px var(--sans);display:flex;gap:12px;margin-top:6px}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;background:var(--bg);border-radius:8px;padding:8px 10px;margin:8px 0 14px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

/* Search results */
#sr{position:absolute;left:0;top:0;bottom:0;width:min(520px,100%);background:var(--panel);border-right:1px solid var(--line);box-shadow:var(--shadow);display:none;flex-direction:column;z-index:4}
#sr.open{display:flex}
#sr .sh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#sr .sh .cnt{flex:1;color:var(--muted);font-size:13px}
#sr .sb{overflow:auto;flex:1;padding:6px 8px 60px}
.hit{display:block;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.hit:hover{background:var(--hover)}
.hit .ht{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:baseline}
.hit .ht .lw{font-weight:400;color:var(--muted);font-size:12px}
.hit .sn2{font:14px/1.45 var(--serif);color:var(--muted);margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* Home */
#home{max-width:920px;margin:0 auto;padding:36px 28px 100px}
#home h1{font:600 30px/1.2 var(--serif);margin:0 0 6px}
#home .lead{color:var(--muted);margin:0 0 26px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:34px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow)}
.card .ct{font:600 16px/1.3 var(--serif)}
.card .cm{color:var(--muted);font-size:12.5px}
.card .ca{display:flex;gap:6px;margin-top:6px}
.steps{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 24px}
.steps h2{font:600 19px var(--serif);margin:0 0 12px}
.steps ol{margin:0;padding-left:20px}
.steps li{margin-bottom:14px}
.bm{display:inline-block;padding:8px 14px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;cursor:grab;margin:4px 0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);margin-top:8px}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quick a{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;text-decoration:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;display:none;z-index:50;max-width:90vw}
.hide{display:none!important}
.mobile-only{display:none}

@media (max-width: 1100px){ #toc{display:none} #toc.open{display:block;position:absolute;left:0;top:0;bottom:0;z-index:3;box-shadow:var(--shadow)} .mobile-only{display:inline-flex} }
@media (max-width: 860px){
  header{flex-wrap:wrap;padding:8px 10px;gap:8px}
  #lawSel{max-width:none;flex:1}
  .searchwrap{order:3;flex-basis:100%;max-width:none}
  #doc{padding:20px 16px 120px}
  article.p{padding:8px 10px 8px 10px;margin:0 -10px}
  .rbtn{position:static;display:inline-flex;margin:4px 0 0 6px;vertical-align:middle}
  .rbtn.none{display:none}
  #rp{position:fixed;inset:0;width:auto;z-index:20;border:0}
}
@media print{ header,#toc,#rp,#sr,.rbtn{display:none!important} #reader{overflow:visible} }
</style>
</head>
<body>
<header>
  <button class="iconbtn mobile-only" id="tocBtn" title="Indholdsfortegnelse" aria-label="Indholdsfortegnelse"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="brand" id="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M5 7h14M7 7l-3 7a3 3 0 0 0 6 0L7 7zm10 0l-3 7a3 3 0 0 0 6 0l-3-7zM8 21h8"/></svg>Lovopslag</div>
  <select id="lawSel" aria-label="Vælg lov"></select>
  <div class="searchwrap">
    <input type="search" id="q" placeholder="Søg i loven – fx »§ 25 a« eller »tilladelse betalingsinstitut«" autocomplete="off">
  </div>
  <button class="btn" id="addBtn">+ Tilføj lov</button>
</header>
<main>
  <nav id="toc" aria-label="Indholdsfortegnelse"></nav>
  <div id="reader"><div id="doc"></div><div id="home" class="hide"></div></div>
  <aside id="rp" aria-label="Bemærkninger">
    <div class="rh">
      <div class="row"><h2 id="rpTitle">Bemærkninger</h2><button class="iconbtn" id="rpClose" title="Luk" aria-label="Luk">✕</button></div>
      <div class="sub" id="rpSub"></div>
      <div class="tools">
        <div class="seg" id="rpOrder"><button data-v="new" class="on">Nyeste først</button><button data-v="old">Ældste først</button></div>
        <button class="btn small" id="rpExpand">Fold alle ud</button>
      </div>
    </div>
    <div class="rb" id="rpBody"></div>
  </aside>
  <section id="sr" aria-label="Søgeresultater">
    <div class="sh">
      <span class="cnt" id="srCnt"></span>
      <div class="seg" id="srScope"><button data-v="law" class="on">Denne lov</button><button data-v="all">Alle love</button><button data-v="rem">Bemærkninger</button></div>
      <button class="iconbtn" id="srClose" aria-label="Luk søgning">✕</button>
    </div>
    <div class="sb" id="srBody"></div>
  </section>
</main>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" multiple class="hide">

/* ---------------- storage ---------------- */
const DB = {
  db: null, mem: new Map(),
  async open(){
    try{
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("lovopslag", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("laws", { keyPath: "eli" });
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    }catch(e){ this.db = null; toast("Kunne ikke åbne lokal lagring – lovene gemmes kun i denne session."); }
  },
  tx(mode){ return this.db.transaction("laws", mode).objectStore("laws"); },
  async all(){
    if(!this.db) return [...this.mem.values()];
    return new Promise((res, rej) => { const r = this.tx("readonly").getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  async put(v){
    this.mem.set(v.eli, v);
    if(!this.db) return;
    return new Promise((res, rej) => { const r = this.tx("readwrite").put(v); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
  },
  async del(k){
    this.mem.delete(k);
    if(!this.db) return;
    return new Promise((res, rej) => { const r = this.tx("readwrite").delete(k); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
  }
};

/* ---------------- permanent lagring i Claude (db + assets) ---------------- */
const Cloud = {
  ready: false, db: null, assets: null, uid: null,
  async init(){
    try{
      if(!window.claude || typeof window.claude.use !== "function") return false;
      const [db, user, assets] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("assets")]);
      if(!db || !user || !assets) return false;
      const uid = await user.id(); if(!uid) return false;
      Object.assign(this, { db, assets, uid, ready: true });
      return true;
    }catch(e){ return false; }
  },
  col(){ return this.db.collection("data/users/" + this.uid); },
  key(eli){ return "law" + eli.replace(/[^A-Za-z0-9]+/g, "_"); },
  async list(){ const snap = await this.col().get(); return snap.docs.filter(d => d.exists && d.id.startsWith("law")).map(d => d.data()); },
  async save(pack){

/* ---------------- state ---------------- */
const S = { cloud: false, laws: [], cur: null, sel: null, order: "new", scope: "law", idx: new Map(), alias: {} };
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = h => h.replace(/<[^>]+>/g, " ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").replace(/\s+/g, " ").trim();
const nid = nr => "p-" + nr.replace(/\s+/g, "-");
// "82-84" -> 82,83,84 ; "69 c og 69 d" -> 69 c, 69 d ; "5 a-5 c" -> 5 a, 5 b, 5 c
function expandNr(nr){
  const out = new Set([nr]);
  for(let part of nr.split(/,| og /)){
    part = part.trim(); if(!part) continue; out.add(part);
    const r = part.match(/^(\d+)(?: ([a-z]))?-(\d+)(?: ([a-z]))?$/);
    if(r){ const a=+r[1], b=+r[3];
      if(a===b && r[2] && r[4]) for(let c=r[2].charCodeAt(0); c<=r[4].charCodeAt(0); c++) out.add(a+" "+String.fromCharCode(c));
      else if(b>=a && b-a<100){ for(let i=a;i<=b;i++) out.add(String(i)); if(r[2]) out.add(a+" "+r[2]); if(r[4]) out.add(b+" "+r[4]); } }
  }
  return [...out];
}
function remarkIds(L, nr){ const s = new Set(); for(const k of expandNr(nr)) (L.byPar[k] || []).forEach(i => s.add(i)); return [...s]; }
/* ---------------- stykker ----------------
   Which stykke (stk.) of a paragraph a remark is about, in today's numbering. Read from the remark's
   heading ("Til nr. 27 (§ 71, stk. 1, nr. 4, ...)") or from the amending provision ("I § 71, stk. 2, der
   bliver stk. 3, ..."), then moved along by later bills that inserted or repealed stykker in the same §.
   A remark that cannot be tied to one stykke (fx »Til § 71« in the original law) belongs to the whole §. */
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const parRe = nr => new RegExp("§ " + reEsc(nr) + "(?![0-9])(?! [a-z](?![a-zæøå]))", "g");
// Reads "3", "3 og 4", "3-5", "1, nr. 4" after "stk. " ; stops before "2. pkt." and similar
function readNums(s){
  const nums = []; let i = 0;
  for(;;){
    const m = s.slice(i).match(/^(\d+)(?!\d)(?:\s*[-–]\s*(\d+))?/);
    if(!m) break;
    if(/^\.\s*(pkt|[a-zæøå])/.test(s.slice(i + m[0].length))) break;
    const a = +m[1], b = m[2] ? +m[2] : a; for(let k = a; k <= b && k - a < 30; k++) nums.push(k);
    i += m[0].length;
    const sep = s.slice(i).match(/^(?:,\s*|\s+og\s+|\s+eller\s+)(?:stk\.\s*)?(?=\d)/); if(!sep) break;
    i += sep[0].length;
  }
  return { nums, end: i };
}
// References "§ nr, stk. X" in a text: [{ nums, rest }] where nums already follow "der bliver stk. Y"
function stkRefs(text, nr){
  const out = []; const re = parRe(nr); let m;
  while((m = re.exec(text))){
    const after = text.slice(m.index + m[0].length);
    const s = after.match(/^\s*,?\s*stk\.\s*/); if(!s) continue;
    const r = readNums(after.slice(s[0].length)); if(!r.nums.length) continue;
    const rest = after.slice(s[0].length + r.end);
    const bl = rest.match(/^[^»;]{0,40}?der bliver (?:til )?stk\.\s*/);
    out.push({ nums: bl ? (readNums(rest.slice(bl[0].length)).nums.length ? readNums(rest.slice(bl[0].length)).nums : r.nums) : r.nums, old: r.nums, rest });
  }
  return out;
}
function stkMap(L, nr){
  L._stk = L._stk || {};
  if(L._stk[nr]) return L._stk[nr];
  const ids = remarkIds(L, nr);
  const node = L.law.nodes.find(n => n.t === "p" && n.nr === nr);
  const count = node ? 1 + (node.html.match(/<p class="stk">/g) || []).length : 1;
  const own = expandNr(nr);
  const info = ids.map(i => {
    const r = L.remarks[i], b = L.bills[r.b];
    const c = strip(r.c || ""), pre = c.split("»")[0], quoted = c.slice(pre.length);
    let targets = null, ev = { reset: false, ins: [], rep: [] };
    for(const k of own){
      const hr = stkRefs(r.h || "", k), cr = stkRefs(pre, k);
      if(!targets && hr.length) targets = hr.flatMap(x => x.nums);
      if(!targets && cr.length) targets = cr.flatMap(x => x.nums);
      const mentions = parRe(k).test(pre);
      if((mentions && /affattes/.test(pre) && !cr.length) || new RegExp("»\\s*§ " + reEsc(k) + "\\.").test(quoted)) ev.reset = true;
      if(mentions && /indsættes/.test(pre) && !/affattes/.test(pre)){
        const q = [...quoted.matchAll(/(?:^|[»"]\s*|\.\s)Stk\.\s*(\d+)\./g)].map(x => +x[1]);
        if(q.length){ ev.ins.push(...q); if(!targets) targets = q; }
      }
      for(const x of cr) if(/^\s*,?\s*ophæves/.test(x.rest)) ev.rep.push(...x.old);
    }
    return { i, d: billDate(b) + "-" + String(r.b).padStart(4, "0"), targets, ev };
  });
  const later = info.slice().sort((a, b) => a.d.localeCompare(b.d));
  const byStk = {}, whole = [], old = [];
  for(const it of info){
    // a remark that repeals a stykke is about text that no longer exists
    let t = it.targets ? [...new Set(it.targets)].filter(s => !it.ev.rep.includes(s)) : null;
    if(t && !t.length){ old.push(it.i); continue; }
    let gone = false;
    const seen = new Set();
    for(const e of later){
      if(e.d <= it.d || seen.has(e.d)) continue;
      seen.add(e.d);
      // all remarks of the same bill together make up its events
      const evs = later.filter(x => x.d === e.d).map(x => x.ev);
      if(evs.some(v => v.reset)){ gone = true; break; }
      const rep = [...new Set(evs.flatMap(v => v.rep))].sort((a, b) => b - a);
      const ins = [...new Set(evs.flatMap(v => v.ins))].sort((a, b) => a - b);
      if(!t) continue;
      t = t.map(s => { for(const x of rep){ if(s === x) return null; if(s > x) s--; } return s; });
      if(t.some(s => s === null)){ gone = true; break; }
      t = t.map(s => { for(const p of ins) if(s >= p) s++; return s; });
    }
    if(gone){ old.push(it.i); continue; }
    if(!t){ whole.push(it.i); continue; }
    t = t.filter(s => s >= 1 && s <= count);
    if(!t.length){ old.push(it.i); continue; }
    for(const s of t) (byStk[s] = byStk[s] || []).push(it.i);
  }
  return (L._stk[nr] = { count, byStk, whole, old, all: ids.length });
}
function toast(m, ms=3200){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none", ms); }

function shortTitle(L){

  const p = t.match(/\(([^)]+)\)\s*$/); if(p) return p[1][0].toUpperCase() + p[1].slice(1);

/* Lovpakker, der ligger på hjemmesiden i mappen lovpakker/ (listet i lovpakker/liste.json) */
const DEFAULT_PACKS = ["lov-om-finansiel-virksomhed.lovpakke.json", "lov-om-betalinger.lovpakke.json", "hvidvaskloven.lovpakke.json", "lov-om-spil.lovpakke.json"];
async function loadServerPacks(){
  if(location.protocol === "file:") return;
  let files = null;
  try{ const r = await fetch("lovpakker/liste.json", { cache: "no-cache" }); if(r.ok){ const j = await r.json(); files = Array.isArray(j) ? j : (j.filer || j.files); } }catch(e){}
  if(!Array.isArray(files)) files = DEFAULT_PACKS;
  let n = 0;
  await Promise.all(files.map(async f => {
    try{
      const r = await fetch("lovpakker/" + encodeURIComponent(f).replace(/%2F/g, "/"), { cache: "no-cache" });
      if(!r.ok) return;
      const o = await r.json(); if(!validPack(o)) return;
      o.fromServer = true;
      const ex = S.laws.find(l => l.eli === o.eli || l.title === o.title);
      if(ex && !ex.fromServer && ex.fetched > o.fetched) return; // en nyere lokalt importeret version vinder
      S.laws = S.laws.filter(l => l !== ex).concat(o); n++;
    }catch(e){}
  }));
  if(!n) return;
  S.server = true;
  S.laws.sort((a,b)=>shortTitle(a).localeCompare(shortTitle(b),"da"));
  fillSelect();
  if(!S.cur) route();
}
function validPack(o){ return o && o.format === "lovopslag" && o.law && Array.isArray(o.law.nodes) && o.eli; }
async function importFiles(files){
  let n = 0;
  for(const f of files){
    try{
      const o = JSON.parse(await f.text());
      if(!validPack(o)) { toast(f.name + " er ikke en lovpakke fra Lovopslag."); continue; }
      // replace older version of same law (same title) if present
      const same = S.laws.filter(l => l.eli !== o.eli && l.title === o.title);
      for(const s of same){ await DB.del(s.eli).catch(()=>{}); if(S.cloud) await Cloud.del(s.eli); }
      await DB.put(o).catch(()=>{}); n++;
      if(S.cloud){ toast("Gemmer " + shortTitle(o) + " i din Claude-konto…", 20000); try{ await Cloud.save(o); }catch(e){ toast("Loven kunne ikke gemmes permanent: " + (e && e.message || e)); } }
      S.laws = S.laws.filter(l => l.eli !== o.eli && l.title !== o.title).concat(o).sort((a,b)=>shortTitle(a).localeCompare(shortTitle(b),"da"));
      S.idx.delete(o.eli);
      location.hash = "#/" + encodeURIComponent(o.eli);
    }catch(e){ toast("Kunne ikke læse " + f.name + ": " + e.message); }
  }
  if(n) toast(n === 1 ? "Loven er tilføjet." : n + " love er tilføjet.");
  fillSelect();
}

/* ---------------- reader ---------------- */

    else if(n.t === "p"){
      const cnt = remarkIds(L, n.nr).length;
      for(const k of expandNr(n.nr)) if(k !== n.nr) S.alias[k] = n.nr;
      const sm = cnt ? stkMap(L, n.nr) : { count: 1, byStk: {}, whole: [] };
      let sk = 0;
      const html = n.html.replace('<p class="par">', '<p class="par"><span class="pn" data-nr="' + esc(n.nr) + '">' + esc(n.label || ("§ " + n.nr + ".")) + '</span> ')
        .replace(/<p class="(par|stk)">([\s\S]*?)<\/p>/g, (all, cls, inner) => {
          const m = cls === "stk" && inner.match(/Stk\.\s*(\d+)\./); sk = m ? +m[1] : sk + 1;
          const c = (sm.byStk[sk] || []).length + sm.whole.length;
          const label = "§ " + n.nr + (sm.count > 1 ? ", stk. " + sk : "");
          const btn = '<button class="rbtn' + (c ? '' : ' none') + '" data-nr="' + esc(n.nr) + '" data-stk="' + sk + '" title="Specielle bemærkninger til ' + esc(label) + '">Bemærkninger' + (c ? ' <span class="c">' + c + '</span>' : '') + '</button>';
          return '<p class="' + cls + '" data-stk="' + sk + '">' + inner + btn + '</p>';
        });
      parts.push('<article class="p" id="' + nid(n.nr) + '" data-nr="' + esc(n.nr) + '">' + html + '</article>');
    }
    else if(n.t === "x"){ parts.push('<div class="x">' + n.html + '</div>'); }
    else if(n.t === "ik" || n.t === "bilag"){ parts.push('<details class="block"><summary>' + esc(n.title || (n.t === "ik" ? "Ikrafttrædelsesbestemmelser" : "Bilag")) + '</summary>' + n.html + '</details>'); }
  }
  if(L.law.footnotes && L.law.footnotes.length) parts.push('<details class="block"><summary>Fodnoter</summary>' + L.law.footnotes.join("") + '</details>');
  const gen = (byPar["_"] || []).length;
  if(gen) parts.push('<p style="margin-top:30px"><button class="btn" id="genBtn">Bemærkninger uden paragrafhenvisning (' + gen + ')</button></p>');
  D.innerHTML = parts.join("");
  linkify(D, L);
  $("#toc").innerHTML = toc.join("") || '<div class="empty">Ingen kapitler</div>';
  $("#reader").scrollTop = 0;
  const pb = $("#probs"); if(pb) pb.onclick = e => { e.preventDefault(); showProblems(L); };
  const gb = $("#genBtn"); if(gb) gb.onclick = () => openRemarks("_");
  fillSelect();
}
// Make in-law cross references (»§ 25«, »§§ 7-10 a«) clickable when they refer to this law
function linkify(root, L){
  const exists = new Set(L.law.nodes.filter(n=>n.t==="p").map(n=>n.nr));
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (/§/.test(n.nodeValue) && n.parentElement.closest("article.p") && !n.parentElement.closest(".pn,.rbtn,a")) ? 1 : 3 });
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  const re = /§§? (\d+(?: [a-z](?![a-zæøå]))?)/g;
  for(const tn of nodes){
    const s = tn.nodeValue; let m, last = 0, out = null;
    re.lastIndex = 0;
    while((m = re.exec(s))){
      const after = s.slice(m.index + m[0].length, m.index + m[0].length + 70);
      if(/^(?:,? ?(?:stk\.|nr\.|litra|\d|[a-z]\b|og|-|–)[^.;:»«§]*?)?,? i (?!denne lov)(?:lov|[a-zæøå]+loven|forordning|direktiv|bekendtgørelse|[A-ZÆØÅ])/.test(after) || /^ i (?!denne)/.test(after)) continue;
      if(!exists.has(m[1])) continue;
      out = out || document.createDocumentFragment();
      out.appendChild(document.createTextNode(s.slice(last, m.index)));
      const a = document.createElement("a"); a.className = "xref"; a.dataset.go = m[1]; a.textContent = m[0];
      out.appendChild(a); last = m.index + m[0].length;
    }
    if(out){ out.appendChild(document.createTextNode(s.slice(last))); tn.parentNode.replaceChild(out, tn); }
  }
}
function goPar(nr, fromRoute){
  if(!S.cur) return false;
  nr = nr.toLowerCase().replace(/^§\s*/, "").replace(/\s+/g, " ").trim();
  if(!document.getElementById(nid(nr)) && S.alias && S.alias[nr]) nr = S.alias[nr];
  const el = document.getElementById(nid(nr));
  if(!el) { toast("§ " + nr + " findes ikke i denne lov."); return false; }
  el.scrollIntoView({ block: "start" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  if(!fromRoute) setHash(S.cur.eli, nr);
  return true;
}
function showProblems(L){
  openPanel("Advarsler fra importen", esc(L.short), '<div class="note">Disse lovforslag kunne ikke kobles automatisk. Bemærkningerne kan læses direkte på Retsinformation.</div><ul style="font-size:14px">' + L.problems.map(p => '<li>' + esc(p) + '</li>').join("") + '</ul>');
}

/* ---------------- remarks ---------------- */
function openPanel(title, sub, body){
  $("#rpTitle").textContent = title; $("#rpSub").innerHTML = sub; $("#rpBody").innerHTML = body; $("#rpBody").scrollTop = 0;
  $("#rp").classList.add("open");
}
function closeRemarks(){ $("#rp").classList.remove("open"); $$("#doc .sel").forEach(a => a.classList.remove("sel")); S.sel = null; S.selStk = undefined; }
function openRemarks(nr, focusIdx, stk){
  const L = S.cur; if(!L) return;
  if(nr !== "_" && S.alias[nr] && !L.law.nodes.some(n => n.t === "p" && n.nr === nr)) nr = S.alias[nr];
  S.sel = nr; S.selStk = stk;
  $$("#doc .sel").forEach(a => a.classList.remove("sel"));
  const art = document.getElementById(nid(nr));
  if(art){
    let el = stk ? art.querySelector('p[data-stk="' + stk + '"]') : art;
    if(el) el.classList.add("sel");
    // the numbered items (1), 2) ...) under a stykke belong to it
    if(stk) while(el && (el = el.nextElementSibling) && !el.matches("p.par, p.stk")) if(el.tagName === "P") el.classList.add("sel");
  }
  const sm = nr !== "_" && stk ? stkMap(L, nr) : null;
  const sorted = ids => ids.map(i => ({ i, r: L.remarks[i], b: L.bills[L.remarks[i].b] }))
    .sort((a, b) => { const d = billDate(a.b).localeCompare(billDate(b.b)); return S.order === "new" ? -d : d; });
  const own = sorted(sm ? (sm.byStk[stk] || []) : nr === "_" ? (L.byPar["_"] || []).slice() : remarkIds(L, nr));
  const whole = sm ? sorted(sm.whole) : [];
  const card = (it, open) => {
    const b = it.b, r = it.r;
    return '<details class="rc" data-i="' + it.i + '"' + (open ? ' open' : '') + '><summary>' +
      '<div class="k">' + (b.later ? '<span class="tag" style="background:var(--mark)">Ikke indarbejdet</span>' : '') + '<span>' + esc(b.lov || b.short) + '</span></div>' +
      '<div class="hd">' + esc(r.h || "") + '</div></summary><div class="body">' + r.x + '</div></details>';
  };
  const first = focusIdx != null ? focusIdx : (own[0] || whole[0] || {}).i;
  let body = own.map(it => card(it, it.i === first)).join("");
  if(whole.length) body += (own.length ? '<div class="grp">Til hele § ' + esc(nr) + '</div>' : '') + whole.map(it => card(it, it.i === first)).join("");
  if(!own.length && !whole.length) body = '<div class="empty">Ingen specielle bemærkninger.</div>';
  if(sm && sm.all > own.length + whole.length) body += '<p><a href="#" class="allrem" data-nr="' + esc(nr) + '">Alle bemærkninger til § ' + esc(nr) + ' (' + sm.all + ')</a></p>';
  const label = nr === "_" ? "" : "§ " + nr + (sm && sm.count > 1 ? ", stk. " + stk : "");
  const all = own.concat(whole);
  openPanel(nr === "_" ? "Bemærkninger uden paragrafhenvisning" : "Bemærkninger til " + label, esc(shortTitle(L)) + ' · ' + all.length + ' afsnit fra ' + new Set(all.map(x => x.r.b)).size + ' lovforslag', body);
  $("#rpExpand").textContent = "Fold alle ud";
  if(focusIdx != null){ const d = $('#rpBody details[data-i="' + focusIdx + '"]'); if(d) setTimeout(() => d.scrollIntoView({ block: "start" }), 30); }
  if(nr !== "_") setHash(L.eli, nr);
}

/* ---------------- search ---------------- */
function textIndex(L){
  if(S.idx.has(L.eli)) return S.idx.get(L.eli);
  const pars = L.law.nodes.filter(n => n.t === "p").map(n => { const t = strip(n.html); return { nr: n.nr, label: n.label || ("§ " + n.nr), t, l: t.toLowerCase() }; });
  let rem = null;
  const ix = { pars, get rem(){ if(!rem){ rem = L.remarks.map((r, i) => { const t = strip((r.h || "") + " · " + r.x); return { i, t, l: t.toLowerCase() }; }); } return rem; } };
  S.idx.set(L.eli, ix); return ix;
}
function parseQuery(q){
  const terms = []; q.replace(/"([^"]+)"|»([^«]+)«|(\S+)/g, (m, a, b, c) => { const t = (a || b || c || "").toLowerCase(); if(t) terms.push(t); });
  return terms;
}
function snippet(t, terms){
  const l = t.toLowerCase(); let pos = l.indexOf(terms[0]); if(pos < 0) pos = 0;
  const start = Math.max(0, pos - 80), end = Math.min(t.length, pos + 180);
  let s = (start > 0 ? "…" : "") + t.slice(start, end) + (end < t.length ? "…" : "");
  s = esc(s);
  for(const term of terms){ if(term.length < 2) continue; s = s.replace(new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>"); }
  return s;
}
function doSearch(){
  const q = $("#q").value.trim();
  if(!q){ closeSearch(); return; }
  const pm = q.match(/^(?:§\s*)?(\d+)(?:\s*([a-zA-Z]))?\.?$/);
  const terms = parseQuery(q.replace(/^§\s*/, ""));
  let hits = [];
  const laws = S.scope === "all" || !S.cur ? S.laws : [S.cur];
  if(S.scope === "rem" && S.cur){
    const ix = textIndex(S.cur);
    for(const r of ix.rem){ if(terms.every(t => r.l.includes(t))){ hits.push({ type: "rem", L: S.cur, r }); if(hits.length >= 300) break; } }
  } else {
    if(pm){
      const nr = pm[1] + (pm[2] ? " " + pm[2].toLowerCase() : "");
      for(const L of laws){ const n = L.law.nodes.find(n => n.t === "p" && (n.nr === nr || expandNr(n.nr).includes(nr))); if(n) hits.push({ type: "par", L, p: { nr: n.nr, label: n.label || "§ " + n.nr, t: strip(n.html) }, exact: true }); }
      if(hits.length === 1 && laws.length === 1){ closeSearch(); goPar(hits[0].p.nr); return; }
    }
    if(!pm){
      for(const L of laws){ const ix = textIndex(L); for(const p of ix.pars){ if(terms.every(t => p.l.includes(t))){ hits.push({ type: "par", L, p }); if(hits.length >= 500) break; } } }
    }
  }
  renderHits(hits, terms, q);
}
function renderHits(hits, terms, q){
  const B = $("#srBody");
  $("#srCnt").textContent = hits.length ? hits.length + (hits.length >= 300 ? "+" : "") + " resultater" : "Ingen resultater";
  B.innerHTML = hits.map((h, k) => {
    if(h.type === "rem"){
      const b = h.L.bills[h.L.remarks[h.r.i].b];
      const tgs = Object.entries(h.L.byPar).filter(([nr, ids]) => ids.includes(h.r.i)).map(([nr]) => nr);
      return '<a class="hit" data-k="' + k + '"><div class="ht">' + (tgs.length && tgs[0] !== "_" ? "§ " + esc(tgs.slice(0,3).join(", §")) : "Generelt") + ' <span class="lw">' + esc(b.short) + ' · ' + esc(h.L.remarks[h.r.i].h || "") + '</span></div><div class="sn2">' + snippet(h.r.t, terms) + '</div></a>';
    }
    return '<a class="hit" data-k="' + k + '"><div class="ht">' + esc(h.p.label.replace(/\.$/, "")) + (S.scope === "all" ? ' <span class="lw">' + esc(shortTitle(h.L)) + '</span>' : '') + '</div><div class="sn2">' + snippet(h.p.t, terms.length ? terms : [""]) + '</div></a>';
  }).join("") || '<div class="empty">Ingen bestemmelser matcher »' + esc(q) + '«.' + (S.scope === "law" ? '<br><br>Prøv »Alle love« eller »Bemærkninger«.' : '') + '</div>';
  $$(".hit", B).forEach(a => a.onclick = () => {
    const h = hits[+a.dataset.k];
    if(S.cur !== h.L) renderLaw(h.L);
    if(h.type === "rem"){
      const tgs = Object.entries(h.L.byPar).filter(([nr, ids]) => ids.includes(h.r.i)).map(([nr]) => nr);
      const nr = tgs[0] || "_"; if(nr !== "_") goPar(nr); openRemarks(nr, h.r.i);
      setTimeout(() => highlightIn($("#rpBody details[data-i='" + h.r.i + "']"), terms), 60);
    } else { goPar(h.p.nr); highlightIn(document.getElementById(nid(h.p.nr)), terms); }
    if(window.innerWidth < 860) closeSearch();
  });
  $("#sr").classList.add("open");
}
function highlightIn(el, terms){
  if(!el) return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  const ts = terms.filter(t => t.length > 1); if(!ts.length) return;
  const re = new RegExp("(" + ts.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  for(const tn of nodes){
    if(tn.parentElement.closest("mark,.rbtn,summary")) continue;
    const s = tn.nodeValue; if(!re.test(s)) continue; re.lastIndex = 0;
    const span = document.createElement("span"); span.innerHTML = esc(s).replace(re, "<mark>$1</mark>");
    tn.parentNode.replaceChild(span, tn);
  }
}
function closeSearch(){ $("#sr").classList.remove("open"); }

/* ---------------- events ---------------- */
function bind(){
  window.addEventListener("hashchange", route);
  $("#brand").onclick = () => { location.hash = ""; };
  $("#addBtn").onclick = () => { if(location.hash === "#/tilfoej") showHome(true); else location.hash = "#/tilfoej"; };
  $("#lawSel").onchange = e => { if(e.target.value) location.hash = "#/" + encodeURIComponent(e.target.value); else location.hash = ""; };
  $("#file").onchange = e => { importFiles([...e.target.files]); e.target.value = ""; };
  $("#tocBtn").onclick = () => $("#toc").classList.toggle("open");
  let t; $("#q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(doSearch, 220); });
  $("#q").addEventListener("keydown", e => { if(e.key === "Enter"){ clearTimeout(t); doSearch(); } if(e.key === "Escape"){ $("#q").value = ""; closeSearch(); } });
  $("#srClose").onclick = closeSearch;
  $("#srScope").onclick = e => { const v = e.target.dataset.v; if(!v) return; S.scope = v; $$("#srScope button").forEach(b => b.classList.toggle("on", b.dataset.v === v)); doSearch(); };
  $("#rpClose").onclick = closeRemarks;
  $("#rpOrder").onclick = e => { const v = e.target.dataset.v; if(!v) return; S.order = v; $$("#rpOrder button").forEach(b => b.classList.toggle("on", b.dataset.v === v)); if(S.sel) openRemarks(S.sel, null, S.selStk); };
  $("#rpBody").addEventListener("click", e => { const a = e.target.closest(".allrem"); if(a){ e.preventDefault(); openRemarks(a.dataset.nr); } });
  $("#rpExpand").onclick = () => { const ds = $$("#rpBody details.rc"); const open = ds.some(d => !d.open); ds.forEach(d => d.open = open); $("#rpExpand").textContent = open ? "Fold alle sammen" : "Fold alle ud"; };
  $("#doc").addEventListener("click", e => {
    const rb = e.target.closest(".rbtn, .pn"); if(rb){ openRemarks(rb.dataset.nr, null, rb.dataset.stk ? +rb.dataset.stk : undefined); return; }
    const x = e.target.closest(".xref"); if(x){ goPar(x.dataset.go); return; }
  });
  $("#toc").addEventListener("click", e => { const a = e.target.closest("a[data-to]"); if(!a) return; e.preventDefault(); const el = document.getElementById(a.dataset.to); if(el) el.scrollIntoView({ block: "start" }); $("#toc").classList.remove("open"); });
  document.addEventListener("keydown", e => {
    if((e.key === "/" || (e.key === "k" && (e.metaKey || e.ctrlKey))) && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); $("#q").select(); }
    if(e.key === "Escape" && document.activeElement !== $("#q")){ closeRemarks(); closeSearch(); }
  });
  // drag & drop anywhere
  document.addEventListener("dragover", e => { if(e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
  document.addEventListener("drop", e => { if(e.target.closest && e.target.closest("#drop")) return; if(e.dataTransfer && e.dataTransfer.files.length){ e.preventDefault(); importFiles([...e.dataTransfer.files]); } });
  // highlight active chapter in toc
  $("#reader").addEventListener("scroll", () => { clearTimeout(bind._s); bind._s = setTimeout(syncToc, 120); });
}
function syncToc(){
  const links = $$("#toc a[data-to]"); if(!links.length) return;
  const top = $("#reader").getBoundingClientRect().top + 40; let cur = null;
  for(const a of links){ const el = document.getElementById(a.dataset.to); if(el && el.getBoundingClientRect().top <= top) cur = a; else if(el) break; }
  links.forEach(a => a.classList.toggle("active", a === cur));
}
init();
</script>
